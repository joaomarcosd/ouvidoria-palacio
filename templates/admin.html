<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso do Gestor - Palácio das Ferramentas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <div class="logo">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Palácio das Ferramentas Logo" class="logo-img">
        </div>
        <nav>
            <ul>
                <li><a href="/">Voltar ao Site</a></li>
            </ul>
        </nav>
    </header>

    <main class="container login-box">
        <h2>Área Restrita do Gestor</h2>
        <p>Por favor, insira a senha de acesso para visualizar os registros.</p>

        {% if erro %}
        <p class="erro">{{ erro }}</p>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="senha">Senha de Acesso</label>
                <input type="password" id="senha" name="senha" required placeholder="Digite a senha...">
            </div>
            <button type="submit" class="btn-submit">Entrar no Painel</button>
        </form>
    </main>

</body>
</html>
